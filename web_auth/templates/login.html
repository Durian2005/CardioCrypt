{% extends "base.html" %}

{% block title %}登录 - CardioCrypt{% endblock %}

{% block content %}
<div class="login-page-container">
    <div class="login-card-wrapper">
        <div class="card shadow-lg border-0 rounded-lg">
            
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="login-icon mb-3">
                        <i class="fas fa-heartbeat fa-3x text-primary"></i>
                    </div>
                    <p class="lead fw-bold" style="font-size: 2rem;">
                        用户登录
                    </p>
                    <p class="lead">
                        智能心脏健康监护系统
                    </p>
                    
                </div>
                <form method="post" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="请输入用户名">
                        </div>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-arrow-right me-2"></i>身份认证
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i>返回首页
                        </a>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3">
                <div class="small">
                    没有账号？<a href="{{ url_for('register') }}">立即注册</a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* 设置body和html高度 */
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: url("{{ url_for('static', filename='images/background.jpg') }}") no-repeat center center fixed;
        background-size: cover;
    }
    
    /* 隐藏导航栏容器的背景 */
    body {
        background-color: transparent !important;
    }
    
    /* 隐藏主容器背景 */
    .container-fluid {
        background: none !important;
        min-height: calc(100vh - 60px);
        padding: 0 !important;
    }
    
    .container-fluid .row {
        margin: 0 !important;
    }
    
    .main-content {
        padding: 0 !important;
        background: transparent !important;
    }
    
    .login-page-container {
        min-height: calc(100vh - 60px);
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 10%;
        position: relative;
    }
    
    .login-card-wrapper {
        width: 450px;
        max-width: 90%;
    }
    
    .login-page-container .card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
    }
    
    /* 页脚样式调整 */
    footer.footer {
        position: relative;
        margin-top: 0;
        background: rgba(0, 0, 0, 0.5) !important;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
    }
    
    @media (max-width: 768px) {
        .login-page-container {
            justify-content: center;
            padding-right: 0;
        }
    }
</style>
{% endblock %}
