{% extends "base.html" %}

{% block title %}注册 - 心电脉搏信号身份认证系统{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg border-0 rounded-lg mt-5">
            <div class="card-header bg-primary text-white">
                <h3 class="text-center font-weight-light my-4">
                    <i class="fas fa-user-plus me-2"></i>用户注册
                </h3>
            </div>
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="register-icon mb-3">
                        <i class="fas fa-user-plus fa-3x text-success"></i>
                    </div>
                    <p class="lead">
                        请输入您想要注册的用户名，然后连接心电设备进行身份特征采集
                    </p>
                    <div class="register-features">
                        <span class="badge bg-light text-dark me-2">
                            <i class="fas fa-database me-1"></i>数据采集
                        </span>
                        <span class="badge bg-light text-dark me-2">
                            <i class="fas fa-cog me-1"></i>特征提取
                        </span>
                        <span class="badge bg-light text-dark">
                            <i class="fas fa-save me-1"></i>模型训练
                        </span>
                    </div>
                </div>
                <form method="post" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="请输入用户名">
                        </div>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-arrow-right me-2"></i>下一步
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i>返回首页
                        </a>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3">
                <div class="small">
                    已有账号？<a href="{{ url_for('login') }}">立即认证</a>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}
